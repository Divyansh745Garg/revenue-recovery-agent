server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # Route 1: Auth Service
        - id: auth-service
          uri: http://auth-service:8081 #http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: RequestRateLimiter # <-- RATE LIMITER: Prevents login brute-force
              args:
                redis-rate-limiter.replenishRate: 2
                redis-rate-limiter.burstCapacity: 5
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

        # Route 2: Product Service
        - id: product-service
          uri: http://product-service:8082 #http://localhost:8082
          predicates:
            - Path=/api/v1/products/**
          filters:
            - AuthenticationFilter # THE BOUNCER IS ACTIVE
            - name: RequestRateLimiter # <-- RATE LIMITER: Prevents API spam
              args:
                redis-rate-limiter.replenishRate: 2
                redis-rate-limiter.burstCapacity: 5
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

        # Route 4: Merchant Recovery Console (isolated proxy; no checkout-route changes)
        - id: recovery-agent-service
          uri: http://recovery-agent-service:8086
          predicates:
            - Path=/recovery-console/**
          filters:
            - StripPrefix=1
        # Route 3: Order Service
        - id: order-service
          uri: http://order-service:8083 #http://localhost:8083
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - AuthenticationFilter # THE BOUNCER IS ACTIVE
            - name: RequestRateLimiter # <-- RATE LIMITER: Prevents API spam
              args:
                redis-rate-limiter.replenishRate: 2
                redis-rate-limiter.burstCapacity: 5
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"
  data:
    redis:
      host: redis
      port: 6379
      timeout: 1000ms          # Max time to wait for a command to finish (1 second)
      connect-timeout: 1000ms  # Max time to wait for a connection to establish (1 second)

management:
  tracing:
    sampling:
      probability: 1.0 # 100% sampling for development
  zipkin:
    tracing:
      endpoint: "http://zipkin:9411/api/v2/spans" # Points to the Docker container
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  metrics:
    tags:
      application: ${spring.application.name}

