<!doctype html><html><head><meta charset="utf-8"><title>Merchant Recovery Console</title><style>:root{color-scheme:dark;--bg:#0a1020;--panel:#111a2e;--line:#263453;--text:#eaf0ff;--muted:#9babc9;--ok:#72e5b8;--warn:#ffca6a;--bad:#ff8787}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:17px system-ui}main,header{width:min(1180px,calc(100% - 36px));margin:auto}header{padding:32px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px}.wide{grid-column:1/-1}.eyebrow,.label{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.1em}.auto{color:var(--ok)}.blocked{color:var(--warn);font-weight:bold}.detail,.stat{margin-top:12px;padding:14px;background:#0a1121;border:1px solid var(--line);border-radius:9px}.value{font-size:1.1rem;font-weight:700}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat strong{display:block;color:var(--ok);font-size:2.2rem}button,input{font:inherit;padding:11px 14px;border-radius:8px}button{border:0;background:var(--ok);color:#052218;font-weight:bold;margin:12px 8px 0 0}.reject{background:transparent;color:var(--bad);border:1px solid var(--bad)}canvas{width:100%;height:230px;background:#0a1121;margin-top:18px}@media(max-width:760px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.stats{grid-template-columns:1fr 1fr}}</style></head><body><header><div class="eyebrow">Distributed commerce</div><h1>Merchant Recovery Console</h1></header><main class="grid"><section class="panel"><div class="eyebrow">Scenario A</div><h2>Auto-safe recovery</h2><b class="auto">AUTO-EXECUTED</b><br><button onclick="scenarioA()">Run Scenario A</button><div id="a"></div></section><section class="panel"><div class="eyebrow">Scenario B</div><h2>Approval-gated recovery</h2><b class="blocked">REQUIRES APPROVAL</b><br><button onclick="scenarioB()">Run Scenario B</button><div id="b"></div><div id="approval"></div></section><section class="panel wide"><div class="eyebrow">Batch metrics</div><input id="count" type="number" value="30" min="1"><button onclick="batch()">Run batch</button><div id="stats" class="stats"></div><canvas id="curve" width="1000" height="260"></canvas></section><section class="panel wide"><div class="eyebrow">Audit log</div><button onclick="audits()">Refresh audit log</button><div id="audit"></div></section></main><script>function api(u,o){return fetch(u,o||{}).then(function(r){return r.json()})}function box(t,v){return '<div class="detail"><div class="label">'+t+'</div><div class="value">'+v+'</div></div>'}function scenarioA(){api('api/v1/demo/scenario-a',{method:'POST'}).then(function(d){document.getElementById('a').innerHTML=box('Decision',d.decision.action+' · '+d.decision.confidence)+box('Justification',d.decision.justification)+box('Order status',d.order_status)+ '<button id="retry">Retry same action — idempotency proof</button><div id="dup"></div>';document.getElementById('retry').onclick=function(){api('api/v1/demo/scenario-a/'+d.order_id+'/retry',{method:'POST'}).then(function(x){document.getElementById('dup').innerHTML=box('Duplicate retry result','DUPLICATE REQUEST BLOCKED — no action taken. '+x.execution_count+' execution across '+x.attempts+' attempts.')})}})}function scenarioB(){api('api/v1/demo/scenario-b',{method:'POST'}).then(function(d){document.getElementById('b').innerHTML=box('Decision',d.decision.action+' · '+d.decision.confidence)+box('Justification',d.decision.justification);var q=d.approval_queue.filter(function(x){return x.orderId===d.order_id})[0];document.getElementById('approval').innerHTML=box('Interception status','AWAITING HUMAN APPROVAL — action is blocked')+'<button onclick="resolve(\''+q.id+'\',\'approve\')">Approve</button><button class="reject" onclick="resolve(\''+q.id+'\',\'reject\')">Reject</button>'})}function resolve(id,a){api('api/v1/approvals/'+id+'/'+a,{method:'POST'}).then(function(d){document.getElementById('approval').innerHTML+=box('Approval outcome',d.status)})}function batch(){api('api/v1/batch/run?count='+document.getElementById('count').value,{method:'POST'}).then(function(d){document.getElementById('stats').innerHTML='<div class="stat">Recovery<strong>'+d.recovery_percent.toFixed(1)+'%</strong></div><div class="stat">False positive<strong>'+d.false_positive_percent.toFixed(1)+'%</strong></div><div class="stat">Recovered revenue<strong>'+d.revenue_recovered+'</strong></div><div class="stat">At risk<strong>'+d.revenue_at_risk+'</strong></div>';var c=document.getElementById('curve'),g=c.getContext('2d'),m=Math.max.apply(null,d.recovery_curve.concat([1]));g.clearRect(0,0,c.width,c.height);g.fillStyle='#72e5b8';d.recovery_curve.forEach(function(v,i){var h=v/m*220;g.fillRect(i*c.width/d.recovery_curve.length,240-h,8,h)})})}function audits(){api('api/v1/audits').then(function(r){document.getElementById('audit').innerHTML=r.map(function(x){return box(x.createdAt+' · '+x.orderId,x.decision+' — '+x.signalBundle)}).join('')})}</script></body></html>
